# 将此文件放置到 /etc/nginx/conf.d/shangchaun.conf 后，重启 nginx 即可。
# 部署假设：
#   - 代码克隆在 /var/www/shangchaun
#   - 后端 Node 在 127.0.0.1:3000 由 PM2 守护
#   - 后台 admin 构建产物 dist/ 复制到 /var/www/shangchaun/admin/dist
#   - 图片在 /var/www/shangchaun/server/uploads

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # 域名备案后改成 your-domain.com

    client_max_body_size 20m;

    # 1. 后台管理页面：访问 /admin/ 进入 React SPA
    location /admin/ {
        alias /var/www/shangchaun/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        # HashRouter 无需 history fallback，但保留兼容
    }

    # 兼容裸路径访问根目录（可改成跳转到 /admin/ 或显示一个简单提示）
    location = / {
        return 302 /admin/;
    }

    # 2. 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 3. 用户上传的图片（Nginx 直接走静态，效率比 Node 高）
    location /uploads/ {
        alias /var/www/shangchaun/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 4. 健康检查直通
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }
}

