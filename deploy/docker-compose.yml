services:
  mysql:
    image: mysql:8.0
    container_name: shangchaun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd_change_me
      MYSQL_DATABASE: shangchaun
      MYSQL_USER: shangchaun
      MYSQL_PASSWORD: shangchaun_pwd
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3306:3306"   # 仅监听本机，禁止公网访问
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pwd_change_me"]
      interval: 5s
      timeout: 5s
      retries: 10
